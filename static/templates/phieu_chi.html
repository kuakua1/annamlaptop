{% extends "base.html" %}
{% block title %}Tạo Phiếu Chi Tiền - Kho Hàng An Nam{% endblock %}
{% block page_title %}Tạo Phiếu Chi Tiền{% endblock %}

{% block content %}
<div class="row g-2 g-xl-3 receipt-layout-container">
    <!-- Cột trái: Form tạo phiếu chi -->
    <div class="col-lg-7">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-white py-2 px-3 d-flex justify-content-between align-items-center">
                <span class="fw-bold fs-6">
                    <i class="bi bi-box-arrow-up-right me-2 text-danger"></i>Tạo Phiếu Chi Tiền
                </span>
                <span class="badge bg-danger bg-opacity-10 text-danger font-monospace fs-6 px-3 py-1" id="badge-ma-phieu">
                    CM..../..
                </span>
            </div>
            <div class="card-body p-3">
                <div class="row g-2">
                    <div class="col-md-6">
                        <label class="form-label-compact">Nguồn Tiền Chi <span class="text-danger">*</span></label>
                        <select class="form-select form-select-sm" id="f-chi-loai-quy" onchange="fetchNextCodeChi()">
                            <option value="TIEN_MAT">Tiền mặt (Mã CMxxxx)</option>
                            <option value="NGAN_HANG">Tiền gửi ngân hàng (Mã CGxxxx)</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label-compact">Ngày Chi <span class="text-danger">*</span></label>
                        <input type="date" class="form-control form-control-sm" id="f-chi-ngay" onchange="fetchNextCodeChi()">
                    </div>

                    <div class="col-md-5">
                        <label class="form-label-compact">Người / Đơn Vị Nhận Tiền <span class="text-danger">*</span></label>
                        <input type="text" class="form-control form-control-sm" id="f-chi-doi-tuong" placeholder="Tên NCC, NV, đối tác...">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label-compact">Số Điện Thoại</label>
                        <input type="text" class="form-control form-control-sm" id="f-chi-sdt" placeholder="Số điện thoại...">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label-compact">Số Tiền Chi (VNĐ) <span class="text-danger">*</span></label>
                        <input type="number" class="form-control form-control-sm fw-bold text-danger fs-5 py-1" id="f-chi-so-tien" placeholder="0">
                    </div>

                    <div class="col-12">
                        <label class="form-label-compact">Nội Dung / Lý Do Chi</label>
                        <input type="text" class="form-control form-control-sm py-1" id="f-chi-ly-do" placeholder="Ví dụ: Trả tiền nhập hàng nhà cung cấp, thanh toán tiền điện nước...">
                    </div>

                    <div class="col-12 pt-2 border-top mt-2 d-flex justify-content-between align-items-center">
                        <button type="button" class="btn btn-outline-secondary btn-sm" onclick="resetFormPhieuChi()">
                            <i class="bi bi-arrow-counterclockwise me-1"></i> Làm mới
                        </button>
                        <button type="button" class="btn btn-danger btn-sm px-4 py-1 fw-bold shadow-sm" id="btn-save-phieu-chi" onclick="savePhieuChi()">
                            <i class="bi bi-check2-circle me-1"></i> Lưu Phiếu Chi Tiền
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Cột phải: Phiếu chi gần đây -->
    <div class="col-lg-5">
        <div class="card shadow-sm border-0 receipt-history-card">
            <div class="card-header bg-white py-2 px-3 d-flex justify-content-between align-items-center">
                <span class="fw-bold fs-6">
                    <i class="bi bi-clock-history me-2 text-danger"></i>Phiếu Chi Gần Đây
                </span>
                <button class="btn btn-sm btn-outline-secondary py-0 px-2" onclick="loadRecentChi()" title="Tải lại">
                    <i class="bi bi-arrow-repeat"></i>
                </button>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive receipt-history-body">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light sticky-top">
                            <tr>
                                <th>Mã Phiếu</th>
                                <th>Ngày</th>
                                <th>Người Nhận</th>
                                <th class="text-end">Số Tiền</th>
                            </tr>
                        </thead>
                        <tbody id="tbody-recent-chi">
                            <tr>
                                <td colspan="4" class="text-center py-4 text-muted">
                                    <div class="spinner-border spinner-border-sm text-danger me-2"></div> Đang tải danh sách...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', async function () {
    const today = new Date().toISOString().split('T')[0];
    const el = document.getElementById('f-chi-ngay');
    if (el) el.value = today;

    await fetchNextCodeChi();
    await loadRecentChi();
});

async function fetchNextCodeChi() {
    try {
        const loaiQuy = document.getElementById('f-chi-loai-quy')?.value || 'TIEN_MAT';
        const ngay = document.getElementById('f-chi-ngay')?.value || '';
        const res = await apiRequest(`/api/phieu-chi/next-code?loai_quy=${loaiQuy}&ngay=${ngay}`);
        if (res.success && res.ma_phieu) {
            document.getElementById('badge-ma-phieu').innerText = res.ma_phieu;
        }
    } catch (e) {
        console.warn('Lỗi lấy mã phiếu chi:', e);
    }
}

async function savePhieuChi() {
    const loaiQuy = document.getElementById('f-chi-loai-quy').value;
    const ngay = document.getElementById('f-chi-ngay').value;
    const doiTuong = document.getElementById('f-chi-doi-tuong')?.value.trim();
    const sdt = document.getElementById('f-chi-sdt')?.value.trim();
    const soTien = parseFloat(document.getElementById('f-chi-so-tien')?.value || 0);
    const ghiChu = document.getElementById('f-chi-ly-do')?.value.trim();

    if (!doiTuong) {
        showToast('Vui lòng nhập Tên Người / Đơn Vị Nhận Tiền', 'error');
        return;
    }
    if (!soTien || soTien <= 0) {
        showToast('Vui lòng nhập số tiền chi hợp lệ (> 0)', 'error');
        return;
    }

    const payload = {
        loai_quy: loaiQuy,
        ngay: ngay,
        doi_tuong: doiTuong,
        dien_thoai: sdt,
        so_tien: soTien,
        ghi_chu: ghiChu
    };

    const btn = document.getElementById('btn-save-phieu-chi');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span> Đang lưu...';

    try {
        const res = await apiRequest('/api/phieu-chi', 'POST', payload);
        if (res.success) {
            showToast(`Tạo phiếu chi ${res.data.ma_phieu} thành công!`, 'success');
            resetFormPhieuChi();
            await fetchNextCodeChi();
            await loadRecentChi();
        }
    } catch (e) {
        showToast('Lỗi: ' + e.message, 'error');
    } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="bi bi-check2-circle me-1"></i> Lưu Phiếu Chi Tiền';
    }
}

function resetFormPhieuChi() {
    document.getElementById('f-chi-doi-tuong').value = '';
    document.getElementById('f-chi-sdt').value = '';
    document.getElementById('f-chi-so-tien').value = '';
    document.getElementById('f-chi-ly-do').value = '';
}

async function loadRecentChi() {
    const tbody = document.getElementById('tbody-recent-chi');
    if (!tbody) return;

    try {
        const res = await apiRequest('/api/phieu-chi');
        if (res.success && Array.isArray(res.data)) {
            if (res.data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="text-center py-4 text-muted"><i class="bi bi-inbox fs-3 d-block mb-1"></i> Chưa có phiếu chi nào</td></tr>`;
                return;
            }

            tbody.innerHTML = res.data.slice(0, 30).map(r => {
                const badge = r.loai_quy === 'TIEN_MAT'
                    ? '<span class="badge bg-danger-subtle text-danger border border-danger">TM</span>'
                    : '<span class="badge bg-primary-subtle text-primary border border-primary">TG</span>';
                return `
                    <tr>
                        <td>
                            <div class="fw-bold font-monospace text-danger">${escapeHtml(r.ma_phieu)}</div>
                            ${badge}
                        </td>
                        <td class="small text-muted">${formatDate(r.ngay)}</td>
                        <td>
                            <div class="fw-semibold">${escapeHtml(r.doi_tuong)}</div>
                            <small class="text-muted">${r.dien_thoai ? '📞 ' + escapeHtml(r.dien_thoai) : ''}</small>
                        </td>
                        <td class="text-end fw-bold text-danger font-monospace">
                            ${formatVND(r.so_tien)}
                        </td>
                    </tr>
                `;
            }).join('');
        }
    } catch (e) {
        tbody.innerHTML = `<tr><td colspan="4" class="text-center py-3 text-danger">Lỗi: ${e.message}</td></tr>`;
    }
}

function escapeHtml(text) {
    if (!text) return '';
    return String(text).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
}
</script>
{% endblock %}
