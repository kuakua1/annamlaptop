<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập - Kho Hàng An Nam</title>
    <link rel="icon" type="image/png" href="/static/img/favicon.png?v=2">
    <link rel="shortcut icon" href="/static/img/favicon.png?v=2">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="login-page">
<div class="login-bg-glow login-bg-glow-1"></div>
<div class="login-bg-glow login-bg-glow-2"></div>

<div class="login-card">
    <div class="text-center mb-4">
        <div class="logo-wrapper mb-3">
            <img src="/static/img/logo.png" alt="Logo" class="login-logo-img">
        </div>
        <h3 class="fw-bold mb-1 text-dark tracking-tight">Kho Hàng An Nam</h3>
        <p class="text-muted small mb-0">Hệ thống quản lý kho &amp; kinh doanh</p>
    </div>

    <div id="error-msg" class="alert alert-danger d-none shadow-sm py-2 px-3 small border-0" role="alert"></div>

    <form id="login-form" onsubmit="doLogin(event)">
        <div class="mb-3">
            <label class="form-label form-label-custom">Tên đăng nhập</label>
            <div class="input-group input-group-custom">
                <span class="input-group-text"><i class="bi bi-person"></i></span>
                <input type="text" class="form-control" id="username" placeholder="Nhập tên đăng nhập" required autocomplete="username">
            </div>
        </div>
        <div class="mb-4">
            <label class="form-label form-label-custom">Mật khẩu</label>
            <div class="input-group input-group-custom">
                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                <input type="password" class="form-control" id="password" placeholder="Nhập mật khẩu" required autocomplete="current-password">
                <button class="btn btn-toggle-pw" type="button" id="toggle-pw" onclick="togglePassword()">
                    <i class="bi bi-eye" id="pw-eye"></i>
                </button>
            </div>
        </div>
        <button type="submit" class="btn btn-login-submit w-100" id="login-btn">
            <i class="bi bi-box-arrow-in-right me-2"></i>Đăng Nhập
        </button>
    </form>

    <div class="text-center mt-4 pt-2 border-top border-light-subtle">
        <span class="badge-creator">
            <i class="bi bi-stars text-warning me-1"></i>Made by <strong>Kiên</strong>
        </span>
    </div>

    <!-- Minion Mascot Peeking at Bottom Corner -->
    <div class="minion-peeker" id="minion-peeker">
        <div class="minion-wrapper">
            <!-- Minion Body -->
            <img src="/static/img/minion_base.png" alt="Minion" class="minion-body-img">
            
            <!-- Left Eye Socket & Pupil -->
            <div class="minion-eye minion-eye-left">
                <div class="minion-pupil" id="minion-pupil-left">
                    <img src="/static/img/minion_pupil_real.png" alt="pupil">
                </div>
            </div>
            
            <!-- Right Eye Socket & Pupil -->
            <div class="minion-eye minion-eye-right">
                <div class="minion-pupil" id="minion-pupil-right">
                    <img src="/static/img/minion_pupil_real.png" alt="pupil">
                </div>
            </div>

            <!-- Left Hand (Covering Eye) -->
            <div class="minion-hand minion-hand-left" id="minion-hand-left">
                <img src="/static/img/minion_arm_left.png" alt="left hand">
            </div>

            <!-- Right Hand (Covering Eye) -->
            <div class="minion-hand minion-hand-right" id="minion-hand-right">
                <img src="/static/img/minion_arm_right.png" alt="right hand">
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
const minionPeeker = document.getElementById('minion-peeker');
const pupilLeft = document.getElementById('minion-pupil-left');
const pupilRight = document.getElementById('minion-pupil-right');
const usernameInput = document.getElementById('username');
const passwordInput = document.getElementById('password');

let isPasswordFocused = false;

// Cập nhật vị trí tròng mắt Minion
function setPupilPos(x, y) {
    // Giới hạn biên độ di chuyển trong tròng kính (-5px đến +5px)
    const clampX = Math.max(-6, Math.min(6, x));
    const clampY = Math.max(-6, Math.min(6, y));
    const transform = `translate(${clampX}px, ${clampY}px)`;
    pupilLeft.style.transform = transform;
    pupilRight.style.transform = transform;
}

// 1. Minion nhìn theo con trỏ chuột khi người dùng di chuột tự do
document.addEventListener('mousemove', (e) => {
    if (minionPeeker.classList.contains('covering-eyes')) return;
    if (document.activeElement === usernameInput || document.activeElement === passwordInput) return;

    const rect = minionPeeker.getBoundingClientRect();
    const minionCenterX = rect.left + rect.width / 2;
    const minionCenterY = rect.top + rect.height * 0.3;

    const deltaX = (e.clientX - minionCenterX) / 35;
    const deltaY = (e.clientY - minionCenterY) / 35;
    setPupilPos(deltaX, deltaY);
});

// 2. Khi người dùng nhập Tên đăng nhập: Minion tò mò nhìn sang trái & hướng lên ô đăng nhập
usernameInput.addEventListener('focus', () => {
    minionPeeker.classList.remove('covering-eyes');
    // Nhìn sang trái và hơi ngước lên trên
    setPupilPos(-5, -4);
});

usernameInput.addEventListener('input', (e) => {
    // Di chuyển tròng mắt nhẹ theo độ dài ký tự đang gõ
    const charProgress = Math.min(10, e.target.value.length);
    setPupilPos(-5 + (charProgress * 0.2), -4);
});

usernameInput.addEventListener('blur', () => {
    setPupilPos(0, 0);
});

// 3. Khi người dùng nhập Mật khẩu:
// Nếu đang ở chế độ che mật khẩu (type="password") -> Minion lấy 2 tay che mắt lại!
// Nếu người dùng bật hiện mật khẩu (type="text") -> Minion hé tay ra tò mò nhìn!
function updatePasswordCoverState() {
    if (document.activeElement === passwordInput) {
        if (passwordInput.type === 'password') {
            minionPeeker.classList.add('covering-eyes');
        } else {
            // Mở mắt nhìn trộm mật khẩu
            minionPeeker.classList.remove('covering-eyes');
            setPupilPos(-5, -1);
        }
    } else {
        minionPeeker.classList.remove('covering-eyes');
    }
}

passwordInput.addEventListener('focus', () => {
    isPasswordFocused = true;
    updatePasswordCoverState();
});

passwordInput.addEventListener('blur', () => {
    isPasswordFocused = false;
    minionPeeker.classList.remove('covering-eyes');
    setPupilPos(0, 0);
});

function togglePassword() {
    const pw = document.getElementById('password');
    const eye = document.getElementById('pw-eye');
    if (pw.type === 'password') {
        pw.type = 'text';
        eye.className = 'bi bi-eye-slash';
    } else {
        pw.type = 'password';
        eye.className = 'bi bi-eye';
    }
    updatePasswordCoverState();
}

async function doLogin(e) {
    e.preventDefault();
    const btn = document.getElementById('login-btn');
    const errEl = document.getElementById('error-msg');
    errEl.classList.add('d-none');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Đang đăng nhập...';

    try {
        const res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                username: document.getElementById('username').value,
                password: document.getElementById('password').value,
            }),
            credentials: 'same-origin',
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || 'Đăng nhập thất bại');
        window.location.href = '/dashboard';
    } catch (err) {
        errEl.textContent = err.message;
        errEl.classList.remove('d-none');
        btn.disabled = false;
        btn.innerHTML = '<i class="bi bi-box-arrow-in-right me-2"></i>Đăng Nhập';
    }
}
</script>
</body>
</html>
